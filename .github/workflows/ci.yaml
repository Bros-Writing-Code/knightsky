name: CI

on:
  pull_request:
  push:
    branches: [main] # re-check main after each merge, so PRs merged in quick succession are checked together

permissions:
  contents: read

concurrency:
  # PRs share a group per branch, so a new push cancels the outdated run.
  # Pushes to main use the unique run_id, so every merge gets its own full run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Job names are the PR status check names, so renaming one breaks branch protection's required checks.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check JavaScript types
        run: npm run typecheck

  code-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Report unused files and packages
        id: dead_code
        run: npm run --silent report:dead-code > "$RUNNER_TEMP/dead-code.md"

      - name: Report copied code
        id: duplicates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          npm run --silent report:duplicates -- --no-colors --no-tips | tee "$RUNNER_TEMP/duplicates.txt"
          test -s reports/duplicates/jscpd-report.md

      - name: Publish code reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DEAD_CODE_OUTCOME: ${{ steps.dead_code.outcome }}
          DUPLICATES_OUTCOME: ${{ steps.duplicates.outcome }}
        run: |
          {
            echo '## Code reports'
            echo
            echo 'Findings are advisory. Unused-export reporting is disabled.'
            echo
            echo '### Unused files and packages'
            echo
            if [ "$DEAD_CODE_OUTCOME" != "success" ]; then
              echo '**The unused-code report failed.** See the job log.'
            elif [ -s "$RUNNER_TEMP/dead-code.md" ]; then
              cat "$RUNNER_TEMP/dead-code.md"
            else
              echo 'No unused files or packages were reported.'
            fi
            echo
            echo '### Copied code'
            echo
            if [ "$DUPLICATES_OUTCOME" != "success" ]; then
              echo '**The copied-code report failed.** See the job log.'
            else
              cat reports/duplicates/jscpd-report.md
              echo
              echo '```text'
              cat "$RUNNER_TEMP/duplicates.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }} # repo variable; vite.config.js turns it into the base path (see docs/deployment.md)
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' # PRs never produce a deployable artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [lint, format, test, build, typecheck] # deploy only if all blocking checks passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # lets Pages verify the run comes from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Runs on main aren't grouped, so when two merges land close together the older build can
    # deploy last. If the live site looks stale, re-run the newest CI run on main.
    concurrency:
      group: pages
      cancel-in-progress: false # never cut off a deploy halfway
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
